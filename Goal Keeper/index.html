<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Keeper 2D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* LAYERS */
        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #game-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            perspective: 1000px;
            /* For CSS 3D transforms if needed */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
        }

        /* IFRAME STYLING removed */

        /* GAME OBJECTS */
        .game-object {
            position: absolute;
            transform-origin: center center;
            will-change: transform;
        }

        .game-object img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        #bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gloves (CSS) */
        .glove-container {
            width: 100px;
            height: 100px;
            z-index: 50;
            margin-left: -50px;
            margin-top: -50px;
            pointer-events: none;
        }

        .glove-shape {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .glove-palm {
            position: absolute;
            bottom: 10%;
            left: 20%;
            width: 60%;
            height: 50%;
            background: #ff5722;
            /* Orange palm */
            border-radius: 10px 10px 20px 20px;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.2);
            border: 3px solid #e64a19;
            z-index: 2;
        }

        .glove-finger {
            position: absolute;
            background: #ff5722;
            width: 13%;
            height: 35%;
            top: 5%;
            border-radius: 10px;
            border: 2px solid #e64a19;
            box-shadow: inset -2px 0 5px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .finger-1 {
            left: 22%;
            top: 15%;
            height: 30%;
            transform: rotate(-10deg);
        }

        .finger-2 {
            left: 36%;
            top: 5%;
            height: 40%;
        }

        .finger-3 {
            left: 51%;
            top: 5%;
            height: 40%;
        }

        .finger-4 {
            left: 66%;
            top: 15%;
            height: 30%;
            transform: rotate(10deg);
        }

        .glove-thumb {
            position: absolute;
            background: #ff5722;
            width: 15%;
            height: 30%;
            bottom: 30%;
            left: 5%;
            border-radius: 10px;
            transform: rotate(-45deg);
            border: 2px solid #e64a19;
            z-index: 1;
        }

        .glove-strap {
            position: absolute;
            bottom: 5%;
            left: 20%;
            width: 60%;
            height: 15%;
            background: #333;
            border-radius: 5px;
            z-index: 3;
        }

        /* Styles for right hand vs left hand are handled by scaling X in JS */

        /* Ball Visuals - Simple white ball */
        .ball-visual {
            width: 100px;
            height: 100px;
            margin-left: -50px;
            margin-top: -50px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #eeeeee 40%, #cccccc 100%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .ball-container {
            z-index: 10;
        }

        /* UI ELEMENTS */
        .hud {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            font-size: 24px;
            font-weight: bold;
        }

        #score-display {
            color: #4ade80;
        }

        #lives-display {
            color: #f87171;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
            z-index: 101;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 24px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
            color: #e5e5e5;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.7);
        }

        #level-indicator {
            position: absolute;
            top: 80px;
            width: 100%;
            text-align: center;
            color: #fbbf24;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .show-level {
            opacity: 1 !important;
        }

        /* Hide Sketchfab extra text in game objects if possible using overflow hidden on container */
        .iframe-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- BACKGROUND -->
    <div id="background-layer">
        <img src="stadium.png" id="bg-img" alt="Stadium Background">
    </div>

    <!-- GAMEPLAY LAYER -->
    <div id="game-layer">
        <!-- Gloves will be injected here -->
        <!-- Balls will be injected here -->
    </div>

    <!-- UI LAYER -->
    <div id="ui-layer">
        <div class="hud">
            <span id="score-display">SAVES: 0</span>
            <span id="lives-display">LIVES: 3</span>
        </div>
        <div id="level-indicator">LEVEL UP! SPEED INCREASED</div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay">
        <h1>Reflex Keeper</h1>
        <p id="message">Move your mouse to control the gloves.<br>Block the shots to survive.<br>It gets faster.</p>
        <button id="start-btn">START GAME</button>
    </div>

    <script>
        // --- CONSTANTS ---
        // Gloves and Ball are now CSS only

        // Game tuning
        const HIT_ZONE_RADIUS = 50; // Distance in pixels for save
        const PERSP_START_SCALE = 0.1;
        const PERSP_END_SCALE = 1.0;
        const SPAWN_Y = 0.4; // % of screen height where ball coming from (horizon)

        // Physics constants
        const GRAVITY = 0.3;       // Gravity acceleration
        const BOUNCE_DAMPING = 0.6; // Energy loss on bounce
        const FRICTION = 0.99;      // Air friction

        // --- STATE ---
        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let speedMultiplier = 1.0;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let balls = []; // Array of active ball objects
        let lastShotTime = 0;
        let shotInterval = 1500;

        // Elements
        const gameLayer = document.getElementById('game-layer');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score-display');
        const livesEl = document.getElementById('lives-display');
        const levelEl = document.getElementById('level-indicator');

        // Gloves
        let leftGlove, rightGlove;

        // --- INITIALIZATION ---
        function init() {
            createGloves();

            // Input
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            startBtn.addEventListener('click', startGame);

            // Loop
            requestAnimationFrame(gameLoop);
        }

        function createGloves() {
            // Left Glove
            leftGlove = createGO('glove-container', null);
            leftGlove.innerHTML = createGloveHTML();
            // User requested check: Flip left glove visually via CSS scaleX(-1)
            leftGlove.style.transform = "scaleX(-1)";

            // Right Glove
            rightGlove = createGO('glove-container', null);
            rightGlove.innerHTML = createGloveHTML();

            // Append
            gameLayer.appendChild(leftGlove);
            gameLayer.appendChild(rightGlove);
        }

        function createGloveHTML() {
            return `
                <div class="glove-shape">
                    <div class="glove-finger finger-1"></div>
                    <div class="glove-finger finger-2"></div>
                    <div class="glove-finger finger-3"></div>
                    <div class="glove-finger finger-4"></div>
                    <div class="glove-thumb"></div>
                    <div class="glove-palm"></div>
                    <div class="glove-strap"></div>
                </div>
            `;
        }

        function createGO(type, src) {
            const el = document.createElement('div');
            el.className = `game-object ${type}`;
            if (src) {
                el.innerHTML = `<div class="iframe-container"><img src="${src}"></div>`;
            }
            return el;
        }

        function startGame() {
            isPlaying = true;
            score = 0;
            lives = 3;
            speedMultiplier = 1.0;
            balls.forEach(b => b.el.remove());
            balls = [];
            updateUI();
            overlay.classList.add('hidden');
        }

        function spawnBall() {
            const ballEl = createGO('ball-container', null);
            ballEl.innerHTML = '<div class="ball-visual"></div>';
            gameLayer.appendChild(ballEl);

            // Ball starts from horizon (center top area)
            const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
            const startY = window.innerHeight * SPAWN_Y;

            // Target somewhere in goal area
            const targetX = (window.innerWidth / 2) + (Math.random() - 0.5) * (window.innerWidth * 0.5);
            const targetY = window.innerHeight * 0.8;

            // Calculate initial velocity towards target
            const speed = 8 * speedMultiplier;
            const angle = Math.atan2(targetY - startY, targetX - startX);

            const ballData = {
                el: ballEl,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                scale: PERSP_START_SCALE,
                bounced: false,  // Track if ball has been saved/bounced
                dead: false      // Mark for removal
            };
            balls.push(ballData);
        }

        // --- GAME LOOP ---
        function gameLoop(time) {
            requestAnimationFrame(gameLoop);

            // Update Glove Positions
            const gloveOffset = 60;
            updateElementPos(rightGlove, mouseX + gloveOffset, mouseY);
            updateElementPos(leftGlove, mouseX - gloveOffset, mouseY);

            if (!isPlaying) return;

            // Spawning
            if (time - lastShotTime > shotInterval) {
                spawnBall();
                lastShotTime = time;
            }

            // Update Balls with physics
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];

                if (b.dead) {
                    b.el.remove();
                    balls.splice(i, 1);
                    continue;
                }

                // Apply gravity
                b.vy += GRAVITY;

                // Apply friction
                b.vx *= FRICTION;
                b.vy *= FRICTION;

                // Update position
                b.x += b.vx;
                b.y += b.vy;

                // Update scale based on Y position (depth simulation)
                const depthProgress = (b.y - window.innerHeight * SPAWN_Y) / (window.innerHeight * 0.6);
                b.scale = lerp(PERSP_START_SCALE, PERSP_END_SCALE, Math.min(1, Math.max(0, depthProgress)));

                // Render
                b.el.style.transform = `translate(${b.x}px, ${b.y}px) scale(${b.scale})`;

                // Check collision with gloves (only if not already bounced)
                if (!b.bounced) {
                    const gloveHit = checkGloveCollision(b.x, b.y);
                    if (gloveHit) {
                        // Bounce the ball!
                        handleBounce(b, gloveHit);
                        b.bounced = true;
                        score++;
                        updateUI();

                        if (score % 5 === 0) {
                            speedMultiplier += 0.2;
                            showLevelUp();
                        }
                    }
                }

                // Check if ball is out of bounds
                if (b.y > window.innerHeight + 100 || b.x < -100 || b.x > window.innerWidth + 100) {
                    if (!b.bounced) {
                        // Ball went past without being saved = goal
                        lives--;
                        updateUI();
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    b.dead = true;
                }
            }
        }

        function checkGloveCollision(ballX, ballY) {
            // Right Glove Center
            const rGx = mouseX + 60;
            const rGy = mouseY;
            // Left Glove Center
            const lGx = mouseX - 60;
            const lGy = mouseY;

            const distR = Math.hypot(ballX - rGx, ballY - rGy);
            const distL = Math.hypot(ballX - lGx, ballY - lGy);

            if (distR < HIT_ZONE_RADIUS) {
                return { x: rGx, y: rGy, side: 'right' };
            }
            if (distL < HIT_ZONE_RADIUS) {
                return { x: lGx, y: lGy, side: 'left' };
            }
            return null;
        }

        function handleBounce(ball, glove) {
            // Calculate bounce direction (away from glove center)
            const dx = ball.x - glove.x;
            const dy = ball.y - glove.y;
            const dist = Math.hypot(dx, dy) || 1;

            // Normalize and apply bounce force
            const bounceForce = 15;
            ball.vx = (dx / dist) * bounceForce + (Math.random() - 0.5) * 5;
            ball.vy = (dy / dist) * bounceForce - 8; // Add upward component

            // Apply damping
            ball.vx *= BOUNCE_DAMPING;
            ball.vy *= BOUNCE_DAMPING;
        }

        function updateElementPos(el, x, y) {
            // Keep CSS transform logic separate for gloves since they don't use the ball scale logic
            // We need to preserve the scaleX(-1) for left glove if present
            let transform = `translate(${x}px, ${y}px)`;
            if (el === leftGlove) transform += " scaleX(-1)";
            el.style.transform = transform;
        }



        function gameOver() {
            isPlaying = false;
            overlay.classList.remove('hidden');
            document.getElementById('message').innerHTML = `GAME OVER<br>Score: ${score}<br>Reflex Keeper Custom`;
            startBtn.innerText = "TRY AGAIN";
        }

        function updateUI() {
            scoreEl.innerText = `SAVES: ${score}`;
            livesEl.innerText = `LIVES: ${lives}`;
        }

        function showLevelUp() {
            levelEl.classList.add('show-level');
            setTimeout(() => {
                levelEl.classList.remove('show-level');
            }, 2000);
        }

        // Utils
        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        // Start
        init();

    </script>
</body>

</html>
