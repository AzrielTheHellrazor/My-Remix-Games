<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reflex Keeper 2D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Outer Container - 9:16 aspect ratio, fills screen */
        #outer-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/Gemini_Generated_Image_955yyb955yyb955y-NyBjiIIcpD0bxGTu9Y3NCWeJv3pOy1.webp?P0pG');
            background-size: cover;
            background-position: center;
        }

        /* Game Container - 5:9 aspect ratio frame */
        #game-container {
            position: relative;
            width: min(90vw, 50vh);
            /* 5:9 width - based on height */
            height: min(162vw, 90vh);
            /* 5:9 height - based on width */
            max-width: 800px;
            max-height: 1440px;
            overflow: hidden;
            border-radius: 15px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* LAYERS */
        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #game-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            perspective: 1000px;
            /* For CSS 3D transforms if needed */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
        }

        /* IFRAME STYLING removed */

        /* GAME OBJECTS */
        .game-object {
            position: absolute;
            transform-origin: center center;
            will-change: transform;
        }

        .game-object img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        #bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gloves (CSS) */
        .glove-container {
            width: min(60px, 15vw);
            height: min(60px, 15vw);
            z-index: 50;
            margin-left: min(-30px, -7.5vw);
            margin-top: min(-30px, -7.5vw);
            pointer-events: none;
        }

        .glove-shape {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .glove-palm {
            position: absolute;
            bottom: 10%;
            left: 20%;
            width: 60%;
            height: 50%;
            background: #ff5722;
            /* Orange palm */
            border-radius: 10px 10px 20px 20px;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.2);
            border: 3px solid #e64a19;
            z-index: 2;
        }

        .glove-finger {
            position: absolute;
            background: #ff5722;
            width: 13%;
            height: 35%;
            top: 5%;
            border-radius: 10px;
            border: 2px solid #e64a19;
            box-shadow: inset -2px 0 5px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .finger-1 {
            left: 22%;
            top: 15%;
            height: 30%;
            transform: rotate(-10deg);
        }

        .finger-2 {
            left: 36%;
            top: 5%;
            height: 40%;
        }

        .finger-3 {
            left: 51%;
            top: 5%;
            height: 40%;
        }

        .finger-4 {
            left: 66%;
            top: 15%;
            height: 30%;
            transform: rotate(10deg);
        }

        .glove-thumb {
            position: absolute;
            background: #ff5722;
            width: 15%;
            height: 30%;
            bottom: 30%;
            left: 5%;
            border-radius: 10px;
            transform: rotate(-45deg);
            border: 2px solid #e64a19;
            z-index: 1;
        }

        .glove-strap {
            position: absolute;
            bottom: 5%;
            left: 20%;
            width: 60%;
            height: 15%;
            background: #333;
            border-radius: 5px;
            z-index: 3;
        }

        /* Styles for right hand vs left hand are handled by scaling X in JS */

        /* Ball Visuals - Simple white ball */
        .ball-visual {
            width: min(50px, 12vw);
            height: min(50px, 12vw);
            margin-left: min(-25px, -6vw);
            margin-top: min(-25px, -6vw);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #eeeeee 40%, #cccccc 100%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            animation: spin 0.6s linear infinite;
        }

        /* New Ball Assets - CSS Gradients */
        .ball-visual.blue-ball {
            background: radial-gradient(circle at 35% 35%, #00ffff 0%, #00bcd4 40%, #0097a7 100%);
        }

        .ball-visual.yellow-ball {
            background: radial-gradient(circle at 35% 35%, #ffff00 0%, #fbc02d 40%, #f57f17 100%);
        }

        /* New Glove Assets - CSS Colors */
        /* Blue Gloves */
        .glove-container.blue-gloves .glove-palm,
        .glove-container.blue-gloves .glove-finger,
        .glove-container.blue-gloves .glove-thumb {
            background-color: #2196f3;
            border-color: #1976d2;
        }

        /* Yellow Gloves */
        .glove-container.yellow-gloves .glove-palm,
        .glove-container.yellow-gloves .glove-finger,
        .glove-container.yellow-gloves .glove-thumb {
            background-color: #ffeb3b;
            border-color: #fbc02d;
        }

        /* Black Gloves */
        .glove-container.black-gloves .glove-palm,
        .glove-container.black-gloves .glove-finger,
        .glove-container.black-gloves .glove-thumb {
            background-color: #333333;
            border-color: #000000;
        }

        /* Realistic background override class (if applied to body or outer container) */
        .realistic-background #outer-container {
            background-image: url('https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/Realistic%20background-EURwa0CyIkdGheYQsSDWp5TvMd6pg3.webp?EUUI') !important;
            background-size: 110% 110% !important;
            /* Zoom in to crop edges */
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .ball-container {
            z-index: 10;
        }

        /* UI ELEMENTS */
        .hud {
            padding: clamp(10px, 3vw, 20px);
            display: flex;
            justify-content: space-between;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            font-size: clamp(14px, 4vw, 24px);
            font-weight: bold;
        }

        #score-display {
            color: #4ade80;
        }

        #lives-display {
            color: #f87171;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
            z-index: 101;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(24px, 6vw, 40px);
            /* Reduced significantly */
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: clamp(2px, 1vw, 5px);
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            padding: 0 5px;
            word-wrap: break-word;
            flex-shrink: 0;
            /* Prevent title from disappearing */
        }

        p {
            font-size: clamp(14px, 4vw, 24px);
            margin-bottom: 30px;
            text-align: center;
            max-width: 90%;
            line-height: 1.5;
            color: #e5e5e5;
            padding: 0 15px;
        }

        button {
            padding: clamp(8px, 3vw, 12px) clamp(20px, 8vw, 30px);
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
            touch-action: manipulation;
            margin-top: 5px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.7);
        }

        #level-indicator {
            position: absolute;
            top: 80px;
            width: 100%;
            text-align: center;
            color: #fbbf24;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Customization UI */
        #customization-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            width: 95%;
            max-width: 360px;
            overflow-y: auto;
            /* Scroll if absolutely necessary on tiny screens */
            max-height: 60vh;
        }

        .select-group {
            margin-bottom: 10px;
        }

        .select-label {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-size: 10px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            /* Reduced width */
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .option-btn.selected {
            background: rgba(59, 130, 246, 0.3);
            border-color: #60a5fa;
            font-weight: bold;
        }

        .preview-box {
            width: 35px;
            /* Reduced visual size */
            height: 35px;
            border-radius: 4px;
            margin-bottom: 3px;
            position: relative;
            overflow: hidden;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bg Previews */
        .preview-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Glove Previews - Scale down game assets */
        .preview-glove {
            position: relative !important;
            /* Override game absolute */
            margin: 0 !important;
            transform: scale(0.5);
            transform-origin: center;
            top: 0;
            left: 0;
        }

        /* Ball Previews */
        .preview-ball {
            position: relative !important;
            margin: 0 !important;
            /* Reset responsive sizing for preview */
            width: 30px !important;
            height: 30px !important;
            /* Scale needs to be 1 if we set size manually, or keep distinct visual style */
            transform: scale(0.8) !important;
            margin-left: 0 !important;
            margin-top: 0 !important;
        }

        .show-level {
            opacity: 1 !important;
        }

        /* Hide Sketchfab extra text in game objects if possible using overflow hidden on container */
        .iframe-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- Audio -->
    <audio id="bg-music" loop>
        <source
            src="https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/bg-music-1-pvAVd0Arp5LMrjXcQM5o2pl6gxqGjy.mp3?7LGI"
            type="audio/mpeg">
    </audio>
    <audio id="kick-sound">
        <source
            src="https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/kick-Ii6fIRyslPcpAZyUS2X4xYcVaiccJN.wav?HcfQ"
            type="audio/wav">
    </audio>

    <div id="outer-container">
        <div id="game-container">
            <!-- BACKGROUND -->
            <div id="background-layer">
                <img src="https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/stadium%209%3A16-Vl1tld9I8jqWrRq0Dm2vGnqEGEkdcb.webp?jXRK"
                    id="bg-img" alt="Stadium Background">
            </div>

            <!-- GAMEPLAY LAYER -->
            <div id="game-layer">
                <!-- Gloves will be injected here -->
                <!-- Balls will be injected here -->
            </div>

            <!-- UI LAYER -->
            <div id="ui-layer">
                <div class="hud">
                    <span id="score-display">SAVES: 0</span>
                    <span id="lives-display">LIVES: 3</span>
                </div>

            </div>

            <!-- OVERLAY -->
            <div id="overlay">
                <h1>Reflex Keeper</h1>

                <div id="customization-panel">
                    <!-- Background Selection -->
                    <div class="select-group">
                        <div class="select-label">Select Background</div>
                        <div class="options-container">
                            <div class="option-btn selected" data-type="bg" data-value="default">
                                <div class="preview-box">
                                    <div class="preview-bg"
                                        style="background-image: url('https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/Gemini_Generated_Image_955yyb955yyb955y-NyBjiIIcpD0bxGTu9Y3NCWeJv3pOy1.webp?P0pG')">
                                    </div>
                                </div>
                                <span>Stadium</span>
                            </div>
                            <div class="option-btn" data-type="bg" data-value="realistic">
                                <div class="preview-box">
                                    <div class="preview-bg"
                                        style="background-image: url('https://remix.gg/blob/8cb8ad2d-5588-4aa9-8744-786b9809294e/Realistic%20background-EURwa0CyIkdGheYQsSDWp5TvMd6pg3.webp?EUUI')">
                                    </div>
                                </div>
                                <span>Realistic</span>
                            </div>
                        </div>
                    </div>

                    <!-- Glove Selection -->
                    <div class="select-group">
                        <div class="select-label">Select Gloves</div>
                        <div class="options-container">
                            <!-- Helper for inner HTML of gloves -->
                            <script>
                                const gloveInner = `
                                    <div class="glove-shape">
                                        <div class="glove-finger finger-1"></div>
                                        <div class="glove-finger finger-2"></div>
                                        <div class="glove-finger finger-3"></div>
                                        <div class="glove-finger finger-4"></div>
                                        <div class="glove-thumb"></div>
                                        <div class="glove-palm"></div>
                                        <div class="glove-strap"></div>
                                    </div>`;
                            </script>

                            <div class="option-btn selected" data-type="glove" data-value="default">

                            <div class="option-btn" data-type="glove" data-value="yellow">
                                <div class="preview-box">
                                    <div class="glove-container preview-glove yellow-gloves">
                                        <div class="glove-shape">
                                            <div class="glove-finger finger-1"></div>
                                            <div class="glove-finger finger-2"></div>
                                            <div class="glove-finger finger-3"></div>
                                            <div class="glove-finger finger-4"></div>
                                            <div class="glove-thumb"></div>
                                            <div class="glove-palm"></div>
                                            <div class="glove-strap"></div>
                                        </div>
                                    </div>
                                </div>
                                <span>Yellow</span>
                            </div>

                            <div class="option-btn" data-type="glove" data-value="black">
                                <div class="preview-box">
                                    <div class="glove-container preview-glove black-gloves">
                                        <div class="glove-shape">
                                            <div class="glove-finger finger-1"></div>
                                            <div class="glove-finger finger-2"></div>
                                            <div class="glove-finger finger-3"></div>
                                            <div class="glove-finger finger-4"></div>
                                            <div class="glove-thumb"></div>
                                            <div class="glove-palm"></div>

                    <!-- Ball Selection -->
                    <div class="select-group">
                        <div class="select-label">Select Ball</div>
                        <div class="options-container">
                            <div class="option-btn selected" data-type="ball" data-value="default">
                                <div class="preview-box">
                                    <div class="ball-visual preview-ball"></div>
                                </div>

                            </div>
                            <div class="option-btn" data-type="ball" data-value="blue">
                                <div class="preview-box">
                                    <div class="ball-visual blue-ball preview-ball"></div>
                                </div>
                                <span>Blue</span>
                            </div>
                            <div class="option-btn" data-type="ball" data-value="yellow">
                                <div class="preview-box">

                <button id="start-btn">START GAME</button>
            </div>

            <script>
                // --- CONSTANTS ---
                // Gloves and Ball are now CSS only

                // Game tuning
                const HIT_ZONE_RADIUS = 50; // Distance in pixels for save
                const PERSP_START_SCALE = 0.1;
                const PERSP_END_SCALE = 1.0;
                const SPAWN_Y = 0.45; // % of screen height where ball coming from (horizon - further away)

                // Physics constants
                const GRAVITY = 0.2;       // Gravity acceleration
                const BOUNCE_DAMPING = 0.8; // Energy loss on bounce
                const FRICTION = 0.99;      // Air friction
                const MIN_CATCH_SCALE = 0.5; // Ball must be at least this big to be caught
                const FADE_OUT_TIME = 1500;  // Time in ms for saved ball to disappear

                // --- STATE ---
                let isPlaying = false;
                let score = 0;
                let lives = 3;
                let speedMultiplier = 1.0;

                let mouseX = window.innerWidth / 2;
                let mouseY = window.innerHeight / 2;

                let balls = []; // Array of active ball objects
                let lastShotTime = 0;
                let shotInterval = 1500;

                // Elements
                const gameLayer = document.getElementById('game-layer');
                const overlay = document.getElementById('overlay');
                const startBtn = document.getElementById('start-btn');
                const scoreEl = document.getElementById('score-display');
                const livesEl = document.getElementById('lives-display');
                const bgMusic = document.getElementById('bg-music');
                const kickSound = document.getElementById('kick-sound');
                // Level indicator removed

                // Gloves
                let leftGlove, rightGlove;

                // Mouse velocity tracking for glove tilt
                let prevMouseX = window.innerWidth / 2;
                let mouseVelX = 0;
                let gloveTilt = 0; // Current tilt angle

                // Customization State
                let selectedBg = 'default';
                let selectedGlove = 'default';
                let selectedBall = 'default';

                // --- INITIALIZATION ---
                const gameContainer = document.getElementById('game-container');

                function init() {
                    createGloves();

                    // Input - track mouse relative to game container
                    gameContainer.addEventListener('mousemove', (e) => {
                        handlePointerMove(e.clientX, e.clientY);
                    });

                    // Touch support for mobile
                    gameContainer.addEventListener('touchmove', (e) => {
                        e.preventDefault(); // Prevent scrolling
                        if (e.touches.length > 0) {
                            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                        }
                    }, { passive: false });

                    gameContainer.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        if (e.touches.length > 0) {
                            handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                        }
                    }, { passive: false });

                    startBtn.addEventListener('click', startGame);
                    startBtn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        startGame();
                    });

                    // Customization Logic
                    const options = document.querySelectorAll('.option-btn');
                    options.forEach(btn => {
                        btn.addEventListener('click', () => {
                            const type = btn.dataset.type;
                            const value = btn.dataset.value;

                            // Update UI
                            document.querySelectorAll(`.option-btn[data-type="${type}"]`).forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');

                            // Update State
                            if (type === 'bg') selectedBg = value;
                            if (type === 'glove') selectedGlove = value;
                            if (type === 'ball') selectedBall = value;

                            // Apply immediately for preview (background only)
                            if (type === 'bg') applyBackground();
                            // If user is selecting gloves, update current gloves to show preview
                            if (type === 'glove') updateGloveStyles();
                        });
                    });

                    // Initial apply
                    applyBackground();
                    updateGloveStyles();

                    // Loop
                    requestAnimationFrame(gameLoop);
                }

                function handlePointerMove(clientX, clientY) {
                    const rect = gameContainer.getBoundingClientRect();
                    const relativeX = clientX - rect.left;
                    const relativeY = clientY - rect.top;

                    // Track velocity for tilt
                    mouseVelX = relativeX - prevMouseX;
                    prevMouseX = relativeX;

                    mouseX = relativeX;
                    mouseY = relativeY;
                }

                function createGloves() {
                    // Left Glove
                    leftGlove = createGO('glove-container', null);
                    leftGlove.innerHTML = createGloveHTML();
                    // User requested check: Flip left glove visually via CSS scaleX(-1)
                    leftGlove.style.transform = "scaleX(-1)";

                    // Right Glove
                    rightGlove = createGO('glove-container', null);
                    rightGlove.innerHTML = createGloveHTML();

                    // Append
                    gameLayer.appendChild(leftGlove);
                    gameLayer.appendChild(rightGlove);
                }

                function createGloveHTML() {
                    return `
                <div class="glove-shape">
                    <div class="glove-finger finger-1"></div>
                    <div class="glove-finger finger-2"></div>
                    <div class="glove-finger finger-3"></div>
                    <div class="glove-finger finger-4"></div>
                    <div class="glove-thumb"></div>
                    <div class="glove-palm"></div>
                    <div class="glove-strap"></div>
                </div>
            `;
                }

                function createGO(type, src) {
                    const el = document.createElement('div');
                    el.className = `game-object ${type}`;
                    if (src) {
                        el.innerHTML = `<div class="iframe-container"><img src="${src}"></div>`;
                    }
                    return el;
                }

                function startGame() {
                    isPlaying = true;
                    score = 0;
                    lives = 3;
                    speedMultiplier = 1.0;
                    balls.forEach(b => b.el.remove());
                    balls = [];
                    updateUI();
                    overlay.classList.add('hidden');

                    // Start Music
                    if (bgMusic) {
                        bgMusic.volume = 0.5;
                        bgMusic.play().catch(e => console.log("Audio play failed:", e));
                    }
                }

                function spawnBall() {
                    const ballEl = createGO('ball-container', null);
                    ballEl.innerHTML = '<div class="ball-visual"></div>';

                    // Apply selected ball style
                    if (selectedBall !== 'default') {
                        ballEl.querySelector('.ball-visual').classList.add(`${selectedBall}-ball`);
                    }

                    gameLayer.appendChild(ballEl);

                    // Get container dimensions
                    const containerW = gameContainer.clientWidth;
                    const containerH = gameContainer.clientHeight;

                    // Ball starts from horizon (center top area) with some variation
                    const startX = containerW / 2 + (Math.random() - 0.5) * (containerW * 0.3);
                    const startY = containerH * SPAWN_Y;

                    // Target distribution: full uniform spread - no center bias
                    // Random value from -1 to 1
                    const spreadX = (Math.random() - 0.5) * 2;

                    // Full spread on X (75% of container width from center each side)
                    const targetX = (containerW / 2) + spreadX * (containerW * 0.4);
                    // Y target from upper area to bottom
                    const targetY = containerH * 0.3 + Math.random() * (containerH * 0.6);

                    // Calculate initial velocity towards target - SLOWER speed
                    const speed = 5 * speedMultiplier; // Reduced from 8 to 5
                    const angle = Math.atan2(targetY - startY, targetX - startX);

                    const ballData = {
                        el: ballEl,
                        x: startX,
                        y: startY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        scale: PERSP_START_SCALE,
                        bounced: false,  // Track if ball has been saved/bounced
                        dead: false      // Mark for removal
                    };
                    balls.push(ballData);
                }

                // --- GAME LOOP ---
                function gameLoop(time) {
                    requestAnimationFrame(gameLoop);

                    // Calculate glove tilt based on mouse horizontal velocity
                    // Smooth interpolation towards target tilt
                    const targetTilt = Math.max(-25, Math.min(25, mouseVelX * 2)); // Max ±25 degrees
                    gloveTilt += (targetTilt - gloveTilt) * 0.15; // Smooth interpolation

                    // Decay mouse velocity over time
                    mouseVelX *= 0.9;

                    // Update Glove Positions with tilt
                    const gloveOffset = 35;
                    updateElementPos(rightGlove, mouseX + gloveOffset, mouseY, gloveTilt);
                    updateElementPos(leftGlove, mouseX - gloveOffset, mouseY, -gloveTilt); // Opposite tilt for left

                    if (!isPlaying) return;

                    // Spawning
                    if (time - lastShotTime > shotInterval) {
                        spawnBall();
                        lastShotTime = time;
                    }

                    // Update Balls with physics
                    for (let i = balls.length - 1; i >= 0; i--) {
                        let b = balls[i];

                        if (b.dead) {
                            b.el.remove();
                            balls.splice(i, 1);
                            continue;
                        }

                        // Check if saved ball should fade out
                        if (b.bounced && b.fadeStartTime) {
                            const elapsed = time - b.fadeStartTime;
                            if (elapsed >= FADE_OUT_TIME) {
                                b.dead = true;
                                continue;
                            }
                            // Gradually shrink and fade
                            const fadeProgress = elapsed / FADE_OUT_TIME;
                            b.el.style.opacity = 1 - fadeProgress;
                            b.scale = Math.max(0.1, b.scale * 0.98); // Slowly shrink
                        }

                        // Apply gravity (less for bounced balls going away)
                        if (b.bounced) {
                            b.vy += GRAVITY * 0.2; // Reduced gravity for saved balls
                        } else {
                            b.vy += GRAVITY;
                        }

                        // Apply friction
                        b.vx *= FRICTION;
                        b.vy *= FRICTION;

                        // Update position
                        b.x += b.vx;
                        b.y += b.vy;

                        // Update scale based on Y position (depth simulation) - only for incoming balls
                        if (!b.bounced) {
                            const containerH = gameContainer.clientHeight;
                            const depthProgress = (b.y - containerH * SPAWN_Y) / (containerH * 0.5);
                            b.scale = lerp(PERSP_START_SCALE, PERSP_END_SCALE, Math.min(1, Math.max(0, depthProgress)));
                        }

                        // Render
                        b.el.style.transform = `translate(${b.x}px, ${b.y}px) scale(${b.scale})`;

                        // Check collision with gloves (only if not already bounced AND ball is big enough)
                        if (!b.bounced && b.scale >= MIN_CATCH_SCALE) {
                            const gloveHit = checkGloveCollision(b.x, b.y);
                            if (gloveHit) {
                                // Bounce the ball!
                                handleBounce(b, gloveHit);
                                b.bounced = true;
                                b.fadeStartTime = time; // Start fade timer

                                // Play Kick Sound
                                if (kickSound) {
                                    kickSound.currentTime = 0;
                                    kickSound.play().catch(e => { });
                                }

                                score++;
                                updateUI();

                                // SDK Haptic
                                if (window.FarcadeSDK && window.FarcadeSDK.singlePlayer) {
                                    try { window.FarcadeSDK.singlePlayer.actions.hapticFeedback(); } catch (e) { }
                                }

                                if (score % 5 === 0) {
                                    speedMultiplier += 0.2;
                                    showLevelUp();
                                }
                            }
                        }

                        // Check if ball is out of bounds (only count as goal if not bounced)
                        const containerW = gameContainer.clientWidth;
                        const containerH = gameContainer.clientHeight;
                        if (b.y > containerH + 100 || b.x < -100 || b.x > containerW + 100) {
                            if (!b.bounced) {
                                // Ball went past without being saved = goal
                                lives--;
                                updateUI();
                                // SDK Haptic for failure
                                if (window.FarcadeSDK && window.FarcadeSDK.singlePlayer) {
                                    try { window.FarcadeSDK.singlePlayer.actions.hapticFeedback(); } catch (e) { }
                                }
                                if (lives <= 0) {
                                    gameOver();
                                }
                            }
                            b.dead = true;
                        }
                    }
                }

                function checkGloveCollision(ballX, ballY) {
                    // Right Glove Center
                    const rGx = mouseX + 35;
                    const rGy = mouseY;
                    // Left Glove Center
                    const lGx = mouseX - 35;
                    const lGy = mouseY;

                    const distR = Math.hypot(ballX - rGx, ballY - rGy);
                    const distL = Math.hypot(ballX - lGx, ballY - lGy);

                    if (distR < HIT_ZONE_RADIUS) {
                        return { x: rGx, y: rGy, side: 'right' };
                    }
                    if (distL < HIT_ZONE_RADIUS) {
                        return { x: lGx, y: lGy, side: 'left' };
                    }
                    return null;
                }

                function handleBounce(ball, glove) {
                    // Ball should bounce AWAY - reverse the incoming direction
                    // Reverse both X and Y velocity (ball goes back where it came from)
                    const bounceForce = 12;

                    // Reverse the ball's direction and add upward force
                    ball.vx = -ball.vx * 0.8 + (glove.side === 'right' ? 8 : -8);
                    ball.vy = -Math.abs(ball.vy) * 0.5 - bounceForce; // Always go upward (away)

                    // Apply damping
                    ball.vx *= BOUNCE_DAMPING;
                    ball.vy *= BOUNCE_DAMPING;
                }

                function updateElementPos(el, x, y, tilt) {
                    // Apply position and tilt rotation
                    let transform = `translate(${x}px, ${y}px) rotate(${tilt}deg)`;
                    if (el === leftGlove) transform += " scaleX(-1)";
                    el.style.transform = transform;
                }



                function gameOver() {
                    isPlaying = false;
                    // overlay.classList.remove('hidden'); // Don't show custom overlay

                    if (window.FarcadeSDK && window.FarcadeSDK.singlePlayer) {
                        try { window.FarcadeSDK.singlePlayer.actions.gameOver({ score: score }); } catch (e) { }
                    }
                }

                function updateUI() {
                    scoreEl.innerText = `SAVES: ${score}`;
                    livesEl.innerText = `LIVES: ${lives}`;
                }

                function showLevelUp() {
                    // Level indicator removed
                }

                // Utils
                function lerp(start, end, t) {
                    return start * (1 - t) + end * t;
                }

                // Customization Helpers
                function applyBackground() {
                    if (selectedBg === 'realistic') {
                        document.body.classList.add('realistic-background');
                    } else {
                        document.body.classList.remove('realistic-background');
                    }
                }

                function updateGloveStyles() {
                    // Reset classes
                    const gloveClasses = ['blue-gloves', 'yellow-gloves', 'black-gloves'];
                    leftGlove.classList.remove(...gloveClasses);
                    rightGlove.classList.remove(...gloveClasses);

                    if (selectedGlove !== 'default') {
                        leftGlove.classList.add(`${selectedGlove}-gloves`);
                        rightGlove.classList.add(`${selectedGlove}-gloves`);
                    }
                }

                // Start
                init();

                // Farcade SDK Initialization
                window.onload = function () {
                    if (window.FarcadeSDK) {
                        try {
                            window.FarcadeSDK.singlePlayer.actions.ready();

                            window.FarcadeSDK.on('play_again', () => {
                                // Return to menu instead of starting immediately
                                isPlaying = false;
                                score = 0;
                                lives = 3;
                                balls.forEach(b => b.el.remove());
                                balls = [];
                                updateUI();
                                overlay.classList.remove('hidden'); // Show menu
                            });

                            window.FarcadeSDK.on('toggle_mute', (data) => {
                                if (bgMusic) {
                                    bgMusic.muted = data.isMuted;
                                }
                                if (kickSound) kickSound.muted = data.isMuted;
                            });
                        } catch (e) {
                            console.log("Farcade SDK init error: ", e);
                        }
                    }
                };

            </script>
        </div> <!-- Close game-container -->
    </div> <!-- Close outer-container -->
</body>
